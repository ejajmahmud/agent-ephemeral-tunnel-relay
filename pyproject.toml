[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-ephemeral-tunnel-relay"
version = "0.1.0"
description = "End-to-end encrypted peer-to-peer WebRTC/TLS tunnel broker connecting local desktop agent environments with remote cloud reasoning engines"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
agent-ephemeral-tunnel-relay = "agent_ephemeral_tunnel_relay.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agent_ephemeral_tunnel_relay*"]
